<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Portal - Login & Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .transition-all-300 { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Custom Notification Modal (Replacing alert) -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modal-icon-container" class="w-10 h-10 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600">
                    <i id="modal-icon" class="fa-solid fa-info text-lg"></i>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Notification</h3>
            </div>
            <p id="modal-message" class="text-slate-600 text-sm mb-6">Message goes here.</p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">Got it</button>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="min-h-full flex flex-col">

        <!-- ================= LOGIN SCREEN ================= -->
        <div id="login-screen" class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-50 transition-all-300">
            <div class="max-w-md w-full bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8 sm:p-10">
                
                <!-- Brand Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30 mb-4">
                        <i class="fa-solid fa-cube text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Welcome Back</h1>
                    <p class="text-sm text-slate-500 mt-1">Please sign in to access your dashboard</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <i class="fa-regular fa-envelope"></i>
                            </span>
                            <input type="email" id="login-email" required value="alex.morgan@company.com" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="you@example.com">
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Password</label>
                            <a href="#" onclick="showModal('Forgot Password', 'Password recovery instructions have been sent to your email simulation.', 'info')" class="text-xs font-medium text-indigo-600 hover:text-indigo-500 transition">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                                <i class="fa-regular fa-lock"></i>
                            </span>
                            <input type="password" id="login-password" required value="password123" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                        <label for="remember" class="ml-2 text-sm text-slate-600 select-none">Remember me for 30 days</label>
                    </div>

                    <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition transform active:scale-[0.99] flex items-center justify-center space-x-2">
                        <span>Sign In to Dashboard</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <!-- Quick Demo Login Hint -->
                <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                    <p class="text-xs text-slate-400">Demo Mode: Click sign in with the pre-filled details to explore instantly.</p>
                </div>
            </div>
        </div>


    

    </div>

    <!-- JavaScript Interaction Logic -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            
            // Transition effect
            const loginScreen = document.getElementById('login-screen');
            const dashboardScreen = document.getElementById('dashboard-screen');

            loginScreen.style.opacity = '0';
            setTimeout(() => {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                dashboardScreen.style.opacity = '0';
                setTimeout(() => {
                    dashboardScreen.style.opacity = '1';
                }, 50);
            }, 300);
        }

        function handleLogout() {
            const loginScreen = document.getElementById('login-screen');
            const dashboardScreen = document.getElementById('dashboard-screen');

            dashboardScreen.style.opacity = '0';
            setTimeout(() => {
                dashboardScreen.classList.add('hidden');
                loginScreen.classList.remove('hidden');
                loginScreen.style.opacity = '0';
                setTimeout(() => {
                    loginScreen.style.opacity = '1';
                }, 50);
            }, 300);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        }

        function switchNav(element, titleName) {
            // Update active state in sidebar
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
                item.classList.add('text-slate-400', 'hover:bg-slate-800', 'hover:text-white');
            });
            element.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
            element.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:text-white');

            // Update main title header
            document.getElementById('page-title').innerText = titleName + (titleName === 'Overview' ? ' Dashboard' : ' Management');

            // Close mobile sidebar if open
            if(window.innerWidth < 768) {
                toggleSidebar();
            }
        }

        // Custom Modal implementation
        function showModal(title, message, type = 'info') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const iconContainer = document.getElementById('modal-icon-container');
            const icon = document.getElementById('modal-icon');
            
            if(type === 'success') {
                iconContainer.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-emerald-100 text-emerald-600';
                icon.className = 'fa-solid fa-check text-lg';
            } else {
                iconContainer.className = 'w-10 h-10 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600';
                icon.className = 'fa-solid fa-info text-lg';
            }

            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
